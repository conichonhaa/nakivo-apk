name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilation de l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/nakivo-dashboard.apk

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: nakivo-dashboard-${{ github.run_number }}
          path: dist/nakivo-dashboard.apk

      # Chaque push sur main met à jour la release « latest » :
      # lien de téléchargement fixe, pratique depuis le téléphone.
      - name: Release « latest »
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/nakivo-dashboard.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dernière version (build ${{ github.run_number }})" \
            --notes "Compilé automatiquement depuis ${GITHUB_SHA::7}."

      - name: Release versionnée
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/nakivo-dashboard.apk \
            --title "${GITHUB_REF_NAME}" --generate-notes
